data:
  raw_dir: ../camera/gesture_training_data
  # Landmark-only pipeline (recommended) writes a single ~4 MB cache here:
  landmark_cache: data/landmarks.npz
  # Below are only used by the legacy two-stream pipeline (train.py + Video
  # Swin), which stores 30 frames per clip and needs tens of GB. Kept local so
  # nothing depends on an external drive being mounted.
  processed_dir: data/processed
  augmented_dir: data/augmented
  num_frames: 30
  image_size: 112
  classes: [swipe_left, swipe_right, swipe_up, swipe_down, "null"]

augmentation:
  horizontal_flip: true
  color_jitter: true
  color_jitter_brightness: 0.4
  color_jitter_contrast: 0.3
  color_jitter_saturation: 0.3
  color_jitter_hue: 0.05
  temporal_jitter: true
  temporal_jitter_range: [0.6, 1.4]
  landmark_noise_std: 0.01
  rotation_max_degrees: 3.0
  frame_dropout: true
  frame_dropout_max: 2

model:
  landmark_d_model: 256
  landmark_nhead: 8
  landmark_num_layers: 6
  landmark_dim_feedforward: 1024
  landmark_dropout: 0.1
  fusion_hidden: 512
  fusion_dropout: 0.3
  num_classes: 5

# Legacy two-stream training (train.py). The landmark-only pipeline
# (train_landmark.py) takes its settings from CLI flags instead.
training:
  batch_size: 16
  phase1_epochs: 20
  phase2_epochs: 5
  phase3_epochs: 0
  phase1_lr: 0.0001
  phase2_lr: 0.00005
  phase3_lr_backbone: 0.000005
  phase3_lr_head: 0.00005
  weight_decay: 0.01
  label_smoothing: 0.1
  gradient_clip: 0.5
  precision: fp32

inference:
  confidence_threshold: 0.70
  consecutive_predictions_required: 1
  inference_every_n_frames: 1
  cooldown_frames: 30
  # Fraction of the 30-frame window that must contain a detected hand before
  # the model's prediction is trusted. Below this the window is reported as
  # `null` without running the model — otherwise an empty room produces
  # confident-looking garbage, since all-zero input is out of distribution.
  min_hand_frames_frac: 0.5
